<script type="text/javascript">//<![CDATA[
/* caddy_log: 纯 LuCI 风格, XHR + DOM 拼接, 无外部框架 (与 caddy_status.htm 一致) */
var LOG_URL = '<%=url("admin/network/caddy/get_log")%>';
var CLEAR_URL = '<%=url("admin/network/caddy/clear_log")%>';
var logPaused = false;
var logFilter = 'all';

function logStatusClass(c) {
	if (c >= 500) return 'err';
	if (c >= 400) return 'warn';
	return 'ok';
}

function logEscape(s) {
	var d = document.createElement('div');
	d.appendChild(document.createTextNode(String(s)));
	return d.innerHTML;
}

function logRender() {
	var tb = document.getElementById('caddy_log_list');
	var cnt = document.getElementById('caddy_log_count');
	if (!tb) return;

	XHR.get(LOG_URL, null, function(x) {
		if (!x || x.status !== 200) return;
		var logs = [];
		x.responseText.split('\n').filter(Boolean).forEach(function(l, i) {
			try {
				var o = JSON.parse(l);
				o.__id = i;
				logs.push(o);
			} catch (e) { }
		});
		logs.reverse();

		if (logFilter !== 'all')
			logs = logs.filter(function(l) { return logStatusClass(l.status) === logFilter; });

		if (cnt) cnt.innerHTML = logs.length + ' <em><%:条日志%></em>';

		if (logs.length === 0) {
			tb.innerHTML = '<em><%:暂无日志%></em>';
			return;
		}

		tb.innerHTML = logs.map(function(l) {
			var h = (l.request && l.request.headers) || {};
			var rows = [];
			if (l.ts)
				rows.push(['时间', new Date(l.ts * 1000).toLocaleString()]);
			if (l.request)
				rows.push(['访问', l.request.host + l.request.uri]);
			if (l.request && l.request.method)
				rows.push(['方法', l.request.method]);
			if (l.status)
				rows.push(['状态', l.status]);
			var ip = (h['Cf-Connecting-Ip'] && h['Cf-Connecting-Ip'][0]) || (l.request && l.request.client_ip);
			if (ip)
				rows.push(['IP', ip]);
			var ua = h['User-Agent'] ? h['User-Agent'][0] : null;
			if (ua)
				rows.push(['标识', ua]);
			if (l.duration)
				rows.push(['耗时', (l.duration * 1000).toFixed(2) + ' ms']);

			return '<div class="log-card ' + logStatusClass(l.status) + '">' +
				rows.map(function(r) {
					return '<div class="log-row"><span class="log-label">' + logEscape(r[0]) + '：</span>' + logEscape(r[1]) + '</div>';
				}).join('') +
				'<div class="log-row"><input type="button" class="btn cbi-button view-json" data-idx="' + l.__id + '" value="<%:查看原始 JSON%>" /></div>' +
				'</div>';
		}).join('');

		var list = document.getElementById('caddy_log_list');
		list.querySelectorAll('.view-json').forEach(function(btn) {
			btn.onclick = function() {
				logShowJson(logs[+btn.getAttribute('data-idx')]);
			};
		});
	});
}

function logShowJson(obj) {
	if (!obj) return;
	var copy = {};
	for (var k in obj) { if (k !== '__id') copy[k] = obj[k]; }
	document.getElementById('log_modal_body').textContent = JSON.stringify(copy, null, 2);
	document.getElementById('log_modal').style.display = 'flex';
}

function logCloseModal() {
	document.getElementById('log_modal').style.display = 'none';
}

setInterval(function() {
	if (!logPaused) logRender();
}, 3000);

document.addEventListener('DOMContentLoaded', function() {
	logRender();
	document.getElementById('log_toggle').onclick = function() {
		logPaused = !logPaused;
		this.value = logPaused ? '<%:继续刷新%>' : '<%:暂停刷新%>';
	};
	document.getElementById('log_clear').onclick = function() {
		XHR.get(CLEAR_URL, null, function() {
			var tb = document.getElementById('caddy_log_list');
			var cnt = document.getElementById('caddy_log_count');
			if (tb) tb.innerHTML = '<em><%:暂无日志%></em>';
			if (cnt) cnt.innerHTML = '0 <em><%:条日志%></em>';
		});
	};
	document.getElementById('log_filter').onchange = function() {
		logFilter = this.value;
		logRender();
	};
});
//]]></script>

<style>
.log-card {
	background:rgba(0,0,0,0.04);
	border-left:3px solid #2ecc71;
	border-radius:6px;
	padding:8px 10px;
	margin-bottom:10px;
}
.log-card.warn { border-left-color:#f39c12; }
.log-card.err { border-left-color:#e74c3c; }
.log-row { font-size:13px; line-height:1.8; word-break:break-all; }
.log-label { opacity:0.6; margin-right:6px; }
#log_modal { display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.5); }
/* 弹窗固定暗色终端风: LuCI bootstrap-dark 主题走自己的 cascade.css,
   不触发 prefers-color-scheme, 媒体查询不可靠; 且 JSON 适合暗底亮字 */
#log_modal .modal-box { background:#1e222a; color:#d8dee6; max-width:700px; width:85%; max-height:70vh; overflow:auto; border-radius:6px; border:1px solid rgba(255,255,255,0.15); margin:8vh auto 0; }
#log_modal .modal-box b { color:#fff; }
#log_modal_body { margin:8px 12px; white-space:pre-wrap; word-break:break-all; font-size:12px; color:#d8dee6; }
</style>

<fieldset class="cbi-section">
	<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
		<div>
			<input type="button" class="btn cbi-button cbi-button-apply" id="log_toggle" value="<%:暂停刷新%>" />
			<input type="button" class="btn cbi-button" id="log_clear" value="<%:清空日志%>" />
		</div>
		<div>
			<select id="log_filter">
				<option value="all"><%:全部%></option>
				<option value="warn"><%:警告%></option>
				<option value="err"><%:错误%></option>
			</select>&nbsp;
			<span id="caddy_log_count">0 <em><%:条日志%></em></span>
		</div>
	</div>
	<p id="caddy_log_list"><em><%:加载中...%></em></p>
</fieldset>

<div id="log_modal" onclick="if(event.target===this)logCloseModal()">
	<div class="modal-box">
		<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ccc;">
			<b><%:完整日志%></b>
			<input type="button" class="btn cbi-button" value="<%:关闭%>" onclick="logCloseModal()" />
		</div>
		<pre id="log_modal_body"></pre>
	</div>
</div>
